<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b5cab"><link rel="icon" href="icon-192.png"><title>نظام فحص الجودة – نور</title>
<style>
:root{--bg:#f4f6f8;--fg:#1b2430;--card:#fff;--bd:#d5dbe3;--pri:#0b5cab;--ok:#1a8f4c;--no:#c62828;--hold:#d98a00;--na:#6b7785;--mut:#5d6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e8edf2;--card:#1a232d;--bd:#34414f;--pri:#5aa6f0;--mut:#9aa8b6;--ok:#42c27c;--no:#ef6b6b;--hold:#f0b240;--na:#93a0ae}}
:root[data-theme="dark"]{--bg:#10161d;--fg:#e8edf2;--card:#1a232d;--bd:#34414f;--pri:#5aa6f0;--mut:#9aa8b6;--ok:#42c27c;--no:#ef6b6b;--hold:#f0b240;--na:#93a0ae}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%}
#app{max-width:720px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:19px;margin:6px 0}h2{font-size:17px;margin:18px 0 8px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
textarea{min-height:60px;margin-top:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:9px 12px}
button:disabled{opacity:.6}
.b{background:var(--pri);color:#fff;border-color:var(--pri)}.d{color:var(--no);border-color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.nav{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.nav button{flex:0 0 auto}.nav .on{background:var(--pri);color:#fff}
.q{white-space:pre-line;font-size:15px}.it{border-bottom:1px solid var(--bd);padding:10px 0}.it:last-child{border:0}
.rs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.rs button{padding:8px 2px;font-size:13px}
.r.on{color:#fff}.r.ok.on{background:var(--ok)}.r.no.on{background:var(--no)}.r.hold.on{background:var(--hold)}.r.na.on{background:var(--na)}
.tp{display:block;width:100%;text-align:right;margin:6px 0;padding:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
canvas.sig{width:100%;height:110px;border:1px dashed var(--mut);border-radius:8px;background:#fff;touch-action:none}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:340px}
.ov{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;gap:8px;padding:12px}.ov video{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:8px}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:10;display:none;max-width:90%}
</style>
</head>
<body>
<div id="app">جارٍ التحميل…</div><div id="t"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const A=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=[['ok','مقبول'],['no','غير مقبول'],['hold','معلّق'],['na','لا ينطبق']],RN=k=>(R.find(x=>x[0]==k)||[0,''])[1];
const ROLE={manager:'مدير الجودة',inspector:'مفتش جودة',admin:'مسؤول التقارير'},ST={draft:'مسودة',sent:'مُرسل',approved:'معتمد'};
const COVER='الغلاف الخاص بالمقياس يغلق جيداً وسليم ونظيف؛ أُزيلت الأدوات والمخلفات\nالمقياس الذكي مركّب جيداً وبإحكام';
const F0={ver:2,types:['عداد CT','عداد CT/VT','لوحة CT لاحقة الدفع','لوحة المدينة'],
areas:[['A','بيانات حي الجامعة'],['B','صيانة العامرية'],['C','بيانات الكاظمية'],['D','ابو غريب صيانة الزيتون'],['E','ابو غريب صيانة الشهداء'],['F','ابوغريب صيانة النصر والسلام'],['G','الكرخ الجنوبي - عويريج'],['H','الكرخ الجنوبي - بيانات الرشيد'],['I','بيانات الزعفرانية'],['J','الكرخ الجنوبي - المحمودية'],['K','الكرخ الجنوبي - صيانة الزمبرانية']].map(([l,n])=>({l,n})),
panel:['سعة اللوحة مطابقة لسعة المحولة و مقطع ونوع الكابلات مناسبان لقدرة العداد والقاطع','اطراف الكيبلات: الموصلات مثبتة بالكامل، لا نحاس مكشوف، لا أسلاك مقطوعة، والكابل مثبّت ومشدود بإحكام دون إجهاد على الأطراف','التحقق من اتجاه دخول وخروج الكيبلات و ألوان الأطوار وتسلسلها صحيحان, neutral والأرضي موصولان','التحقق من إعدادات القاطع (MCCB) للوحات المقياس','لا يوجد تجاوز (Bypass) أو وصلة جانبية أو تلاعب قبل العداد أو حوله','الهوائي مركّب بإحكام وفي موضع مناسب للاستقبال، والتوصيل محكم\nشريحة SIM مركّبة في المقياس ومستوى إشارة الشبكة في الموقع جيد بعد التشغيل',COVER,'تشغيل اللوحة والتأكد من عملها بشكل كامل مع وصول الكهرباء الى الزبون','تطبيق قفل وتأشير العزل (LOTO) بعد التنصيب والفحص والتشغيل, للمقياس واللوحة بأقفال خاصة'],
meter:['اطراف الكيبلات: الموصلات مثبتة بالكامل، لا نحاس مكشوف، لا أسلاك مقطوعة، والكابل مثبّت ومشدود بإحكام دون إجهاد على الأطراف','التحقق من اتجاه دخول وخروج الكيبلات و ألوان الأطوار وتسلسلها صحيحان, neutral والأرضي موصولان','لا يوجد تجاوز (Bypass) أو وصلة جانبية أو تلاعب قبل العداد أو حوله','الهوائي مركّب بإحكام وفي موضع مناسب للاستقبال، والتوصيل محكم\nشريحة SIM مركّبة في المقياس ومستوى إشارة الشبكة في الموقع جيد بعد التشغيل',COVER,'تشغيل المقياس والتأكد من عمله بشكل كامل مع وصول الكهرباء الى الزبون','تطبيق قفل وتأشير العزل (LOTO) بعد التنصيب والفحص والتشغيل, للمقياس بأقفال خاصة']};
function fixF(F){for(const k of ['panel','meter']){F[k]=(F[k]||F0[k]).filter(t=>!t.includes('لا يوجد قاطع دائرة')).map(t=>t.includes('الغلاف الخاص بالمقياس')&&!t.includes('بإحكام')?COVER:t)}
if(!F.types?.length)F.types=[...F0.types];if(!F.areas?.length)F.areas=structuredClone(F0.areas);F.ver=2;return F}
let S={u:null,users:[],reports:[],F:null,rep:null,v:'login',mi:0,cred:null,hasUsers:false,busy:0};
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const k=p.split('.'),l=k.pop();let c=o;for(const x of k){c[x]??={};c=c[x]}c[l]=v};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const hash=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('noor|'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',4500)}
const API='https://script.google.com/macros/s/AKfycbwQVUTNwPKQdxV6ehkb0DYg_M31BSYW-k1RQgZO1fR9RXfCvsslvSCj0k3YkFUdXnu5/exec';
async function api(o,t=45000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),t);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...S.cred,...o}),signal:c.signal});return await r.json()}catch(e){return{error:'net'}}finally{clearTimeout(tm)}}
async function apiR(o,n=3,t){let r;for(let i=0;i<n;i++){r=await api(o,t);if(!r.error||['auth','denied','locked'].includes(r.error))return r;await new Promise(z=>setTimeout(z,1500*(i+1)))}return r}
async function loadF(){const r=await api({act:'get',col:'forms',id:'main'});S.F=fixF(r.data||structuredClone(F0))}
async function loadR(){const r=await api({act:'list',col:'reports'});if(r.items)S.reports=r.items.sort((a,b)=>(b.upd||0)-(a.upd||0))}
async function enter(){A.innerHTML='جارٍ التحميل…';await loadF();await loadR();S.v=S.u.role=='admin'?'reports':'home';render()}
const mkCode=r=>r.seq?(r.area||'X')+'-NR-'+r.seq:'';
function meta(r){let bad=0;const c=a=>Object.values(a||{}).forEach(x=>{if(x&&(x.r=='no'||x.r=='hold'))bad++});c(r.ans);(r.meters||[]).forEach(m=>c(m.ans));
return{id:r.id,owner:r.owner,ownerName:r.ownerName,status:r.status,type:r.type,bld:r.bld,date:r.date,code:r.code||'',upd:r.upd||0,up:r.up||'',areaName:r.areaName||'',rev:r.rev||0,of:r.of||'',bad,doc:r.doc||'',serial:r.serial||'',mc:(r.meters||[]).length,ov:r.overall?.r||''}}
const backups=()=>{const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('noorB:'))o.push([k,JSON.parse(localStorage.getItem(k))])}}catch{}return o};
async function persist(st){const r0=S.rep;
try{localStorage.setItem('noorB:'+r0.id,JSON.stringify(r0))}catch{}
if(!r0.seq){const q=await apiR({act:'newseq'});if(!q.seq){toast('تعذّر إنشاء رمز الموقع ('+q.error+'). تحقق من الإنترنت وأعد المحاولة');throw new Error('seq')}r0.seq=q.seq}
const r=structuredClone(r0);if(st)r.status=st;r.upd=Date.now();r.code=mkCode(r);
try{localStorage.setItem('noorB:'+r.id,JSON.stringify(r))}catch{}
const q=await apiR({act:'set',col:'reports',id:r.id,data:r},3,60000);
if(q.error){toast('تعذّر الحفظ ('+q.error+'). بياناتك محفوظة على الهاتف — اضغط إرسال مرة أخرى');throw new Error(q.error)}
try{localStorage.removeItem('noorB:'+r.id)}catch{}
S.rep=r;S.reports=[meta(r),...S.reports.filter(x=>x.id!=r.id)]}
const fld=(l,p,t='text',x='')=>`<label>${l}</label><input type="${t}" data-p="${p}" value="${esc(get(S,p))}" ${x}>`;
function grp(base,ro){const a=get(S,base)||{};return `<div class="rs">${R.map(([k,l])=>`<button class="r ${k} ${a.r==k?'on':''}" data-a="res" data-p="${base}.r" data-v="${k}" ${ro?'disabled':''}>${l}</button>`).join('')}</div>${a.r?`<textarea data-p="${base}.n" placeholder="السبب / الملاحظات" ${ro?'disabled':''}>${esc(a.n)}</textarea>`:''}`}
const items=(list,base,ro)=>list.map((t,i)=>`<div class="it"><div class="q"><b>${i+1}.</b> ${esc(t)}</div>${grp(base+'.'+i,ro)}</div>`).join('');
const sig=(p,ro,l)=>`<label>${l}</label><canvas class="sig" data-p="${p}" ${ro?'data-ro=1':''}></canvas>${ro?'':`<button data-a="clrsig" data-p="${p}">مسح التوقيع</button>`}`;
function nav(){const u=S.u,t=[['home','فحص جديد']];if(u.role!='inspector')t.push(['reports','التقارير']);if(u.role=='manager')t.push(['users','المستخدمون'],['forms','النماذج']);if(u.role=='admin')t.splice(0,1);
return `<div class="top"><h1>نظام فحص الجودة – نور</h1><span class="mut">${esc(u.name)} · ${ROLE[u.role]} <button data-a="out">خروج</button></span></div><div class="nav">${t.map(([k,l])=>`<button data-a="go" data-v="${k}" class="${S.v==k?'on':''}">${l}</button>`).join('')}</div>`}
const repRow=(r,x)=>`<div class="card"><b>${esc(r.bld||'بدون اسم')}</b> <span class="tag">${ST[r.status]}</span>${r.rev?' <span class="tag">إعادة فحص</span>':''}${r.status!='draft'&&!r.up?' <span class="tag" style="color:var(--no)">لم يُرفع إلى Drive</span>':''}<div class="mut">${esc(r.code)} · ${esc(r.areaName)} · ${esc(r.type)}</div><div class="mut">${esc(r.ownerName)} · ${esc((r.date||'').replace('T',' '))}</div><div class="row" style="margin-top:8px"><button data-a="open" data-id="${r.id}">فتح</button>${r.status!='draft'&&!r.up&&S.u.role!='admin'?`<button data-a="reup" data-id="${r.id}">رفع إلى Drive</button>`:''}${x}</div></div>`;
const V={
login:()=>`<div class="card"><h1>${S.hasUsers?'تسجيل الدخول':'إعداد أول حساب: مدير الجودة'}</h1>${fld('الاسم','x','text','id="un"')}<label>كلمة المرور</label><input type="password" id="pw"><button class="b" style="width:100%;margin-top:14px" data-a="${S.hasUsers?'login':'setup'}">${S.hasUsers?'دخول':'إنشاء الحساب'}</button></div>`,
home:()=>{const mine=S.reports.filter(r=>r.owner==S.u.id),bk=backups();return nav()+(bk.length?`<h2>فحوصات لم تُحفظ بسبب خطأ</h2>`+bk.map(([k,r])=>`<div class="card"><b>${esc(r.bld||'بدون اسم')}</b> <span class="mut">${esc(r.code)}</span><div class="row" style="margin-top:8px"><button class="b" data-a="restore" data-k="${esc(k)}">استرجاع وإعادة الإرسال</button></div></div>`).join(''):'')+`<h2>اختر ما ستفحصه</h2>`+S.F.types.map(t=>`<button class="tp b" data-a="new" data-t="${esc(t)}">${esc(t)}</button>`).join('')+`<button class="tp" data-a="go" data-v="redo">طلب تعديل (إعادة فحص)</button><h2>فحوصاتي</h2>`+(mine.map(r=>repRow(r,r.status=='draft'?'<button class="d" data-a="delr" data-id="'+r.id+'">حذف</button>':'')).join('')||'<div class="mut">لا توجد فحوصات بعد</div>')},
redo:()=>{const l=S.reports.filter(r=>r.status!='draft'&&(S.u.role=='manager'||r.owner==S.u.id));return nav()+`<h2>اختر الفحص السابق لتعديله</h2><div class="mut">يُحفظ التعديل كنسخة جديدة «إعادة فحص» ولا يُغيَّر الأصل.</div>`+(l.map(r=>`<div class="card"><b>${esc(r.bld)}</b> <span class="tag">${ST[r.status]}</span>${r.rev?' <span class="tag">إعادة فحص</span>':''}<div class="mut">${esc(r.code)} · ${esc(r.areaName)} · ${esc((r.date||'').replace('T',' '))}</div><div class="mut" style="color:${r.bad?'var(--no)':'var(--ok)'}">${r.bad?'بنود غير مقبولة / معلّقة: '+r.bad:'كل البنود مقبولة'}</div><button class="b" style="margin-top:8px" data-a="mkredo" data-id="${r.id}">تعديل (إعادة فحص)</button></div>`).join('')||'<div class="mut">لا توجد فحوصات مرسلة بعد</div>')},
reports:()=>{const ex=S.u.role!='inspector';return nav()+(ex&&S.reports.length?'<button class="b" data-a="expall" style="width:100%">تصدير ملخص كل التقارير (Excel)</button>':'')+(S.reports.map(r=>repRow(r,(ex?`<button data-a="exp" data-id="${r.id}">تصدير Excel</button>`:'')+(S.u.role=='manager'?`<button class="d" data-a="delr" data-id="${r.id}">حذف</button>`:''))).join('')||'<div class="mut">لا توجد تقارير</div>')},
users:()=>nav()+`<div class="card"><b>مستخدم جديد</b>${fld('الاسم','nu.n','text')}${fld('كلمة المرور','nu.p','password')}<label>الدور</label><select data-p="nu.r">${Object.entries(ROLE).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><button class="b" style="margin-top:10px" data-a="addu">إضافة</button></div>`+S.users.map(u=>`<div class="card"><b>${esc(u.name)}</b><label>الدور</label><select data-a="urole" data-id="${u.id}">${Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${u.role==k?'selected':''}>${l}</option>`).join('')}</select><label>كلمة مرور جديدة</label><div class="row"><input type="password" id="p${u.id}"><button data-a="upw" data-id="${u.id}">تغيير</button>${u.id!=S.u.id?`<button class="d" data-a="delu" data-id="${u.id}">حذف</button>`:''}</div></div>`).join(''),
forms:()=>{const L=(k,t)=>`<h2>${t}</h2>`+S.F[k].map((x,i)=>`<div class="card"><textarea data-p="F.${k}.${i}" style="margin:0">${esc(x)}</textarea><button class="d" data-a="deli" data-k="${k}" data-i="${i}">حذف البند</button></div>`).join('')+`<button data-a="addi" data-k="${k}">+ إضافة بند</button>`;
return nav()+`<h2>أنواع العمل (سطر لكل نوع)</h2><textarea id="tt" style="min-height:110px">${esc(S.F.types.join('\n'))}</textarea><h2>المناطق (حرف + اسم). يظهر الحرف في بداية اسم كل ملف في Drive</h2>`+S.F.areas.map((x,i)=>`<div class="card"><div class="row"><input data-p="F.areas.${i}.l" value="${esc(x.l)}" style="max-width:80px" placeholder="الحرف"><input data-p="F.areas.${i}.n" value="${esc(x.n)}" placeholder="اسم المنطقة"></div><button class="d" data-a="deli" data-k="areas" data-i="${i}">حذف المنطقة</button></div>`).join('')+`<button data-a="addi" data-k="areas">+ إضافة منطقة</button>`+L('panel','بنود فحص اللوحة / العداد CT')+L('meter','بنود فحص المقياس الفرعي')+`<div class="bar"><button class="b" data-a="saveF">حفظ النماذج</button></div><div class="mut" style="margin-top:12px">التعديل يسري على الفحوصات الجديدة فقط.</div>`},
form:()=>{const r=S.rep,ro=r.status!='draft'||r.owner!=S.u.id,pn=/لوحة/.test(r.type),mg=S.u.role=='manager',d=ro?'disabled':'';
return `<div class="top"><button data-a="go" data-v="${S.u.role=='admin'?'reports':'home'}">‹ رجوع</button><span><span class="tag">${ST[r.status]}</span>${r.rev?' <span class="tag">إعادة فحص</span>':''}</span></div><h1>إستمارة الفحص بعد التنصيب</h1><div class="mut">${esc(r.doc||'NOOR-FRM-QC-01-F-01')} · Rev 2 · ${esc(r.type)}</div><div class="mut">رمز الموقع: <b>${esc(mkCode(r)||'يُنشأ عند أول حفظ')}</b></div>

gps(){navigator.geolocation.getCurrentPosition(p=>{S.rep.loc=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);render()},()=>toast('تعذّر تحديد الموقع، فعّل صلاحية الموقع'),{enableHighAccuracy:true,timeout:15000})},
addm(){S.rep.meters.push({serial:'',phase:'',ans:{},assess:{}});S.mi=S.rep.meters.length-1;S.v='meter';render();scrollTo(0,0)},
editm(b){S.mi=+b.dataset.i;S.v='meter';render();scrollTo(0,0)},
delm(b){if(conf(b)){S.rep.meters.splice(+b.dataset.i,1);render()}},
back(){S.v='form';render()},
async draft(b){if(S.busy)return;S.busy=1;try{await persist();render();toast('تم حفظ المسودة')}catch{}S.busy=0},
async send(b){if(S.busy)return;const r=S.rep;if(!r.bld.trim())return toast('أدخل اسم المبنى حسب FDM');if(!r.area)return toast('اختر المنطقة');if(!r.serial.trim())return toast('أدخل الرقم التسلسلي');if(!String(r.rated||'').trim())return toast('أدخل التيار المقنن للوحة');if(r.tp.panel.some((_,i)=>!r.ans[i]?.r))return toast('أجب عن كل بنود الفحص');if(!r.overall?.r)return toast('اختر التقييم العام');if(r.meters.some(m=>!m.serial))return toast('أدخل رقم كل مقياس فرعي');if(!r.sig)return toast('وقّع في خانة التوقيع');
S.busy=1;b.disabled=true;b.textContent='جارٍ الإرسال… لا تغلق الصفحة';r.signDate=now();
try{await persist('sent')}catch{S.busy=0;b.disabled=false;b.textContent='إرسال النموذج';return}
b.textContent='جارٍ رفع الملف إلى Drive…';const up=await upload(S.rep);S.busy=0;
toast(up?'تم الإرسال ورفع الملف إلى Drive ✔':'تم حفظ الفحص وإرساله، لكن تعذّر الرفع إلى Drive. اضغط «رفع إلى Drive» من القائمة');S.v=S.u.role=='admin'?'reports':'home';S.rep=null;render()},
async reup(b){const d=await full(b.dataset.id);if(!d)return;b.disabled=true;b.textContent='جارٍ الرفع…';const ok=await upload(d);toast(ok?'تم الرفع إلى Drive ✔':'تعذّر الرفع، أعد المحاولة');render()},
async appr(){const r=S.rep;if(!r.appr?.sig)return toast('وقّع أولاً');r.appr.by=S.u.name;r.appr.date=now();r.up='';if(S.busy)return;S.busy=1;try{await persist('approved')}catch{S.busy=0;return}toast('جارٍ رفع النسخة المعتمدة إلى Drive…');const ok=await upload(S.rep);S.busy=0;toast(ok?'تم الاعتماد ورفع النسخة المعتمدة إلى Drive ✔':'تم الاعتماد، لكن تعذّر الرفع إلى Drive. استخدم «رفع إلى Drive» من التقارير');S.rep=null;S.v='reports';render()},
async delr(b){if(!conf(b))return;const q=await api({act:'del',col:'reports',id:b.dataset.id});if(q.error)return toast('تعذّر الحذف');S.reports=S.reports.filter(r=>r.id!=b.dataset.id);render()},
async exp(b){const r=await full(b.dataset.id);if(!r)return;try{dl(fname(r),await xl(r))}catch(e){toast('تعذّر إنشاء ملف Excel')}},
async expall(){try{dl('QC-summary.xlsx',await xlAll(S.reports))}catch(e){toast('تعذّر إنشاء ملف Excel')}},
async addu(){const n=S.nu?.n?.trim(),p=S.nu?.p;if(!n||!p||p.length<4)return toast('أدخل الاسم وكلمة مرور (٤ أحرف على الأقل)');if(S.users.some(u=>u.name==n))return toast('الاسم مستخدم');const id=uid(),u={name:n,hash:await hash(p),role:S.nu.r||'manager'};const q=await api({act:'set',col:'users',id,data:u});if(q.error)return toast('تعذّرت الإضافة');S.users.push({id,name:u.name,role:u.role});S.nu={};render()},
async urole(b){const u=S.users.find(x=>x.id==b.dataset.id);u.role=b.value;await api({act:'set',col:'users',id:u.id,data:{name:u.name,role:u.role}});toast('تم تغيير الدور')},
async upw(b){const v=$('#p'+b.dataset.id).value;if(v.length<4)return toast('٤ أحرف على الأقل');const u=S.users.find(x=>x.id==b.dataset.id),h=await hash(v);await api({act:'set',col:'users',id:u.id,data:{name:u.name,role:u.role,hash:h}});if(u.id==S.u.id){S.cred.hash=h;try{localStorage.setItem('noorC',JSON.stringify(S.cred))}catch{}}toast('تم تغيير كلمة المرور')},
async delu(b){if(!conf(b))return;await api({act:'del',col:'users',id:b.dataset.id});S.users=S.users.filter(u=>u.id!=b.dataset.id);render()},
addi(b){const k=b.dataset.k;S.F[k].push(k=='areas'?{l:'',n:''}:'');render()},
deli(b){if(conf(b)){S.F[b.dataset.k].splice(+b.dataset.i,1);render()}},
async saveF(){S.F.types=$('#tt').value.split('\n').map(x=>x.trim()).filter(Boolean);S.F.areas=S.F.areas.filter(a=>a.l.trim()&&a.n.trim()).map(a=>({l:a.l.trim().toUpperCase(),n:a.n.trim()}));const q=await api({act:'set',col:'forms',id:'main',data:S.F});toast(q.error?'تعذّر الحفظ':'تم حفظ النماذج');render()}};
A.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b&&!b.disabled)ACT[b.dataset.a]?.(b)});
A.addEventListener('input',e=>{const p=e.target.dataset.p;if(p&&!e.target.dataset.a)set(S,p,e.target.value)});
A.addEventListener('change',e=>{if(e.target.tagName=='SELECT'&&e.target.dataset.a)ACT[e.target.dataset.a](e.target)});
(async()=>{try{S.cred=JSON.parse(localStorage.getItem('noorC')||'null')}catch{}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const st=await api({act:'status'});if(st.error){A.innerHTML='<div class="card">تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم أعد فتح التطبيق.</div>';return}
S.hasUsers=st.hasUsers;
if(S.cred){const r=await api({act:'login'});if(r.user){S.u=r.user;return enter()}S.cred=null}
render()})();

</script>
</body>
